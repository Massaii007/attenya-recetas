<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>ATTENYA · Sistema Culinario</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1612; color: #e8dfd4; font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }

/* === HEADER === */
.header { background: linear-gradient(180deg, #2a241e 0%, #1a1612 100%); border-bottom: 1px solid #3a322a; padding: 32px 20px 24px; text-align: center; }
.header-sub { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 6px; color: #8a7d6b; margin-bottom: 8px; text-transform: uppercase; }
.header h1 { font-size: 42px; font-weight: 300; color: #f0e6d6; letter-spacing: 12px; }
.app-title { display: inline-block; cursor: pointer; transition: color 0.2s, opacity 0.2s; }
.app-title:hover { color: #c4a97d; }
.header-count { font-size: 14px; color: #8a7d6b; margin-top: 8px; font-family: 'Jost', sans-serif; }

/* === HOME SCREEN === */
.home-active .header, .home-active .periodo-tabs, .home-active .nav-bar, .home-active .footer,
.kitchen-mode .header, .kitchen-mode .periodo-tabs, .kitchen-mode .nav-bar, .kitchen-mode .footer { display: none; }
.kitchen-home { min-height: 100vh; padding: 28px 34px 34px; background: #050604; color: #e8dfd4; }
.kitchen-topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
.kitchen-brand { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 4px; color: #5f7d52; text-transform: uppercase; }
.kitchen-title { font-size: 34px; font-weight: 300; color: #f0e6d6; line-height: 1.1; margin-top: 8px; }
.kitchen-meta { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 4px; color: #5a4e3e; text-transform: uppercase; margin-top: 12px; }
.kitchen-open-system { background: transparent; color: #8a7d6b; border: 1px solid #2f352c; padding: 10px 14px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
.kitchen-open-system:hover { color: #e8dfd4; border-color: #c4a97d; }
.kitchen-days-label { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 4px; color: #5f7d52; text-transform: uppercase; margin: 26px 0 12px; }
.kitchen-day-rail { display: grid; grid-template-columns: repeat(6, minmax(118px, 1fr)); gap: 12px; margin-bottom: 28px; }
.kitchen-day-card { min-height: 96px; background: #11120f; border: 1px solid #2b3129; color: #c4b8a8; padding: 13px 14px; text-align: left; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
.kitchen-day-card.active { border-color: #c4a97d; color: #f0e6d6; }
.kitchen-day-card .day-dot { position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; background: #7da8c4; }
.kitchen-day-card.active .day-dot { background: #c47d7d; }
.kitchen-day-week { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 3px; color: #5f7d52; text-transform: uppercase; }
.kitchen-day-date { font-family: 'Jost', sans-serif; font-size: 12px; color: #8a7d6b; margin-top: 8px; }
.kitchen-day-main { font-family: 'Jost', sans-serif; font-size: 13px; color: #d4c8b8; line-height: 1.25; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kitchen-plate-grid { display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(330px, 0.92fr); gap: 16px; }
.kitchen-hero-card, .kitchen-side-card { border: 1px solid #2b3129; background: #0d0e0c; position: relative; overflow: hidden; cursor: pointer; }
.kitchen-hero-card { min-height: 520px; }
.kitchen-side-stack { display: grid; gap: 14px; }
.kitchen-side-card { min-height: 164px; }
.kitchen-hero-card img, .kitchen-side-card img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.82; filter: saturate(0.95) contrast(1.04); }
.kitchen-hero-card::after, .kitchen-side-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,4,0.08) 0%, rgba(5,6,4,0.2) 48%, rgba(5,6,4,0.82) 100%); pointer-events: none; }
.kitchen-badge { position: absolute; top: 18px; left: 18px; z-index: 2; background: #c47d7d; color: #120f0e; padding: 7px 11px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.kitchen-plate-copy { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; }
.kitchen-plate-date { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 4px; color: #8a7d6b; text-transform: uppercase; margin-bottom: 8px; }
.kitchen-plate-name { font-size: 26px; color: #f0e6d6; line-height: 1.15; }
.kitchen-side-card .kitchen-plate-name { font-size: 18px; }
.kitchen-protein { display: inline-block; margin-left: 10px; border: 1px solid #c47d7d; color: #d7a3a3; padding: 4px 8px; font-family: 'Jost', sans-serif; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; vertical-align: middle; }
.kitchen-restore-hint { display: none; position: fixed; right: 26px; bottom: 22px; z-index: 20; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; color: #6f8ea3; text-transform: uppercase; }
.kitchen-home.idle-restore .kitchen-restore-hint { display: block; }
.kitchen-update-status { position: fixed; left: 26px; bottom: 22px; z-index: 20; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; color: #4f5d4a; text-transform: uppercase; pointer-events: none; }
.kitchen-update-status.updating { color: #c4a97d; }

/* === NAVIGATION TABS === */
.nav-bar { background: #221e19; border-bottom: 1px solid #3a322a; padding: 0 20px; display: flex; justify-content: center; gap: 0; overflow-x: auto; }
.nav-tab { background: none; border: none; border-bottom: 2px solid transparent; color: #8a7d6b; padding: 14px 24px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; transition: all 0.2s; }
.nav-tab:hover { color: #c4a97d; }
.nav-tab.active { color: #c4a97d; border-bottom-color: #c4a97d; }

/* === CONTAINER === */
.container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

/* === CATALOG STYLES (existing) === */
.search-wrap { padding: 20px 0; }
.search-input { width: 100%; background: #221e19; border: 1px solid #3a322a; color: #e8dfd4; padding: 14px 18px; font-size: 15px; font-family: 'Jost', sans-serif; outline: none; }
.search-input:focus { border-color: #c4a97d; }
.search-input::placeholder { color: #5a4e3e; }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; border-bottom: 1px solid #2a241e; }
.cat-btn { background: #221e19; color: #a89880; border: 1px solid #3a322a; padding: 8px 16px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
.cat-btn.active, .cat-btn:hover { background: #c4a97d; color: #1a1612; border-color: #c4a97d; }
.subs { display: none; gap: 6px; overflow-x: auto; padding: 12px 0; border-bottom: 1px solid #2a241e; }
.subs.visible { display: flex; }
.sub-btn { background: transparent; color: #8a7d6b; border: 1px solid #3a322a; padding: 5px 12px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; white-space: nowrap; transition: all 0.2s; }
.sub-btn.active, .sub-btn:hover { background: #5a4e3e; color: #e8dfd4; }
.results-count { padding: 16px 0 8px; font-size: 13px; color: #8a7d6b; font-family: 'Jost', sans-serif; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding-bottom: 40px; }
.card { background: #221e19; border: 1px solid #3a322a; cursor: pointer; transition: all 0.2s; overflow: hidden; }
.card:hover { border-color: #c4a97d; background: #2a241e; }
.card-img { width: 100%; height: 180px; object-fit: cover; display: block; background: #2a241e; }
.card-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg, #2a241e 0%, #3a322a 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; color: #3a322a; }
.card-body { padding: 16px 20px 20px; }
.card-cat { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 2px; color: #8a7d6b; margin-bottom: 6px; text-transform: uppercase; }
.filtro-autores { padding: 10px 0 8px; border-bottom: 1px solid #2a241e; position: relative; }
.filtro-autores-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.autor-dropdown-btn { background: #221e19; color: #c4a97d; border: 1px solid #3a322a; padding: 8px 14px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
.autor-dropdown-btn:hover { background: #2a241e; border-color: #c4a97d; }
.autor-dropdown-btn.open { background: #2a241e; border-color: #c4a97d; }
.autor-dropdown-caret { font-size: 10px; opacity: 0.7; }
.autor-clear-btn { background: transparent; color: #8a7d6b; border: 1px solid #3a322a; padding: 6px 10px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 1px; }
.autor-clear-btn:hover { background: #3a322a; color: #e8dfd4; }
.autor-dropdown-panel { display: none; position: absolute; top: 100%; left: 0; z-index: 50; background: #1a1612; border: 1px solid #3a322a; padding: 8px; min-width: 240px; max-height: 360px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-top: 4px; }
.autor-dropdown-panel.open { display: block; }
.autor-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; color: #a89880; }
.autor-option:hover { background: #221e19; color: #e8dfd4; }
.autor-option input { accent-color: #c4a97d; cursor: pointer; }
.autor-option-count { margin-left: auto; color: #5a4e3e; font-size: 10px; }
.autor-chips-active { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.autor-chip { background: rgba(196,169,125,0.15); color: #c4a97d; border: 1px solid #3a322a; padding: 4px 8px 4px 10px; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
.autor-chip-x { cursor: pointer; opacity: 0.7; font-weight: bold; padding: 0 2px; }
.autor-chip-x:hover { opacity: 1; color: #e8dfd4; }
.card-autor { position: absolute; top: 6px; right: 6px; background: rgba(26,22,18,0.85); color: #c4a97d; padding: 3px 7px; font-family: 'Jost', sans-serif; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid rgba(196,169,125,0.3); backdrop-filter: blur(4px); z-index: 2; pointer-events: none; }
.card { position: relative; }
.card-day { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 1px; color: #7da8c4; margin-bottom: 4px; padding: 2px 8px; background: rgba(125,168,196,0.1); border-radius: 3px; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-prot { padding: 2px 8px; border-radius: 3px; font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }
.card-prot[data-prot="Pescado blanco"] { background: rgba(120,180,210,0.15); color: #78b4d2; }
.card-prot[data-prot="Pescado azul"] { background: rgba(80,130,190,0.2); color: #6fa0d0; }
.card-prot[data-prot="Carne blanca"] { background: rgba(210,180,140,0.15); color: #d2b48c; }
.card-prot[data-prot="Carne roja"] { background: rgba(190,100,100,0.2); color: #c47070; }
.card-prot[data-prot*="Cerdo"] { background: rgba(200,150,120,0.18); color: #c89678; }
.card-prot[data-prot="Vegetariano"] { background: rgba(120,180,120,0.15); color: #7db47d; }
.card-prot[data-prot*="Pasta"], .card-prot[data-prot="Hidrato"] { background: rgba(210,190,130,0.15); color: #d2be82; }
.card-prot[data-prot="Marisco"] { background: rgba(210,140,160,0.15); color: #d28ca0; }
.card-prot[data-prot="Huevo"] { background: rgba(230,200,100,0.15); color: #d2be64; }
.card-prot[data-prot="Legumbre"] { background: rgba(160,140,100,0.18); color: #b4a064; }
.card-name { font-size: 18px; color: #f0e6d6; margin-bottom: 8px; line-height: 1.3; }
.card-desc { font-family: 'Jost', sans-serif; font-size: 13px; color: #a89880; line-height: 1.5; margin-bottom: 12px; font-weight: 300; }
.card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-family: 'Jost', sans-serif; font-size: 11px; background: #2a241e; border: 1px solid #3a322a; padding: 2px 8px; }
.tag-tech { color: #c4a97d; }
.tag-prot { color: #a89880; }

/* === DETAIL STYLES (existing) === */
.detail { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
.back-btn { background: none; border: 1px solid #5a4e3e; color: #c4a97d; padding: 8px 20px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 14px; letter-spacing: 1px; margin-bottom: 24px; transition: all 0.2s; }
.back-btn:hover { background: #c4a97d; color: #1a1612; }
.detail-hero { width: 100%; max-height: 400px; object-fit: cover; display: block; margin-bottom: 24px; border: 1px solid #3a322a; }
.detail-header { border-bottom: 1px solid #3a322a; padding-bottom: 24px; margin-bottom: 24px; }
.detail-cat { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 3px; color: #8a7d6b; margin-bottom: 8px; text-transform: uppercase; }
.detail h1 { font-size: 32px; font-weight: 400; line-height: 1.2; color: #f0e6d6; }
.detail-desc { font-size: 16px; color: #a89880; margin-top: 8px; font-style: italic; }
.detail-tags { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.detail-tag { background: #2a241e; border: 1px solid #3a322a; padding: 6px 14px; font-family: 'Jost', sans-serif; font-size: 13px; }
.detail-tag span:first-child { color: #8a7d6b; }
.detail-tag span:last-child { color: #c4a97d; }
.tab-btns { display: flex; gap: 12px; margin-bottom: 32px; }
.tab-btn { background: transparent; color: #c4a97d; border: 1px solid #c4a97d; padding: 10px 24px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 14px; letter-spacing: 1px; transition: all 0.2s; }
.tab-btn.active { background: #c4a97d; color: #1a1612; }
.content-box { background: #221e19; border: 1px solid #3a322a; padding: 32px 36px; line-height: 2; font-size: 14px; font-weight: 300; color: #c4b8a8; font-family: 'Jost', sans-serif; letter-spacing: 0.2px; }
.content-box .empty-msg { color: #a89880; text-align: center; font-style: italic; font-family: 'Cormorant Garamond', serif; }
.content-box .loading { color: #8a7d6b; text-align: center; font-style: italic; }
.content-section { margin-bottom: 36px; }
.content-section:last-child { margin-bottom: 0; }
.content-section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: #c4a97d; letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #2a241e; }
.content-box h3 { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 400; color: #e8dfd4; margin: 24px 0 10px; letter-spacing: 0.5px; }
.content-box h4 { font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 400; color: #c4a97d; margin: 16px 0 6px; letter-spacing: 2px; text-transform: uppercase; }
.content-box p { color: #c4b8a8; margin-bottom: 10px; font-weight: 300; }
.content-box ul, .content-box ol { margin: 10px 0 10px 20px; color: #c4b8a8; }
.content-box li { margin-bottom: 6px; font-weight: 300; }
.content-box li::marker { color: #5a4e3e; }
.content-box strong { color: #e8dfd4; font-weight: 400; }
.content-box em { color: #8a7d6b; font-weight: 300; }
.content-box blockquote { border-left: 2px solid #5a4e3e; padding: 14px 24px; margin: 20px 0; background: #1a1612; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; color: #a89880; line-height: 1.7; }
.content-box hr { border: none; border-top: 1px solid #2a241e; margin: 24px 0; }
.content-box table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.content-box th, .content-box td { border: 1px solid #2a241e; padding: 10px 14px; text-align: left; font-size: 13px; font-weight: 300; }
.content-box th { background: #1a1612; color: #8a7d6b; font-weight: 400; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.content-box td { color: #c4b8a8; }
.story-content { font-family: 'Cormorant Garamond', serif; font-size: 18px; line-height: 2; color: #c4b8a8; font-weight: 300; }
.story-content h1 { font-size: 26px; font-weight: 300; color: #f0e6d6; margin-bottom: 8px; letter-spacing: 1px; }
.story-content h2 { font-size: 20px; font-weight: 300; color: #c4a97d; margin: 28px 0 14px; border-bottom: 1px solid #2a241e; padding-bottom: 8px; letter-spacing: 1px; }
.story-content p { margin-bottom: 16px; }
.quote-box { background: #1a1612; border-left: 2px solid #5a4e3e; padding: 20px 28px; margin-top: 28px; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; color: #a89880; line-height: 1.7; }

/* === COMPONENTES CLICKABLES === */
.componentes-block { margin-bottom: 32px; }
.componentes-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: #c4a97d; letter-spacing: 2px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #2a241e; }
.componentes-grid { display: flex; flex-direction: column; gap: 8px; }
.comp-card { display: flex; align-items: center; gap: 14px; background: #221e19; border: 1px solid #2a241e; padding: 10px 14px; cursor: pointer; transition: all 0.2s; }
.comp-card:hover { border-color: #c4a97d; background: #2a241e; }
.comp-card-img { width: 52px; height: 52px; object-fit: cover; border: 1px solid #3a322a; flex-shrink: 0; }
.comp-card-info { flex: 1; min-width: 0; }
.comp-card-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #f0e6d6; font-weight: 400; }
.comp-card-tipo { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 2px; color: #8a7d6b; text-transform: uppercase; margin-top: 2px; }

.detail-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 28px; }
.meta-item { background: #1a1612; border: 1px solid #2a241e; padding: 12px 16px; }
.meta-label { font-family: 'Jost', sans-serif; font-size: 9px; letter-spacing: 3px; color: #6b6158; text-transform: uppercase; margin-bottom: 4px; font-weight: 400; }
.meta-value { font-family: 'Jost', sans-serif; font-size: 14px; color: #e8dfd4; font-weight: 300; }
.pdf-btn { background: transparent; color: #8a7d6b; border: 1px solid #3a322a; padding: 8px 20px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; transition: all 0.2s; margin-left: 12px; }
.pdf-btn:hover { background: #c4a97d; color: #1a1612; border-color: #c4a97d; }

/* === MENU VIEW === */
.menu-header { padding: 28px 0 20px; text-align: center; border-bottom: 1px solid #3a322a; margin-bottom: 24px; }
.menu-periodo { font-size: 28px; font-weight: 300; color: #f0e6d6; letter-spacing: 2px; }
.menu-meta { font-family: 'Jost', sans-serif; font-size: 13px; color: #8a7d6b; margin-top: 6px; }
.menu-day { background: #221e19; border: 1px solid #3a322a; margin-bottom: 16px; overflow: hidden; transition: border-color 0.2s; }
.menu-day:hover { border-color: #5a4e3e; }
.menu-day.chef-free { border-left: 3px solid #8b3a3a; }
.menu-day-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.menu-day-date { font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; color: #e8dfd4; }

const APP_BUILD_ID = "2026-05-16T19:26:12Z";
const APP_BUILD_LABEL = "16/05 21:26";
const VERSION_URL = "/version.json";
const UPDATE_CHECK_INTERVAL_MS = 30000;
let updateCheckTimer = null;

function updateStatus(text, mode) {
  var el = document.getElementById('kitchen-update-status');
  if (!el) return;
  el.textContent = text || '';
  el.classList.toggle('updating', mode === 'updating');
}

function withVersionParam(buildId) {
  var url = new URL(window.location.href);
  url.searchParams.set('v', buildId);
  return url.toString();
}

async function checkForAppUpdate(reason) {
  try {
    var response = await fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) return;
    var remote = await response.json();
    if (!remote || !remote.buildId) return;
    if (remote.buildId !== APP_BUILD_ID) {
      updateStatus('Actualizando ' + (remote.label || ''), 'updating');
      window.location.replace(withVersionParam(remote.buildId));
      return;
    }
    if (reason === 'manual' || reason === 'startup') updateStatus('Online · ' + APP_BUILD_LABEL);
  } catch (e) {
    if (reason === 'startup') updateStatus('Offline · ' + APP_BUILD_LABEL);
  }
}

function startSelfUpdater() {
  checkForAppUpdate('startup');
  clearInterval(updateCheckTimer);
  updateCheckTimer = setInterval(function() { checkForAppUpdate('interval'); }, UPDATE_CHECK_INTERVAL_MS);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) checkForAppUpdate('visible');
  });
  window.addEventListener('pageshow', function() {
    checkForAppUpdate('pageshow');
  });
}

function isStandaloneKitchenApp() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

var periodoActualData, periodoAnteriorData;
(function() {
  var today = new Date().toISOString().split('T')[0];
  var mdFirst = menuData.dias[0].fecha;
  var mdLast = menuData.dias[menuData.dias.length - 1].fecha;
  var pvFirst = menuData_prev.dias[0].fecha;
  var pvLast = menuData_prev.dias[menuData_prev.dias.length - 1].fecha;
  
  if (today >= mdFirst && today <= mdLast) {
    periodoActualData = menuData;
    periodoAnteriorData = menuData_prev;
  } else if (today >= pvFirst && today <= pvLast) {
    periodoActualData = menuData_prev;
    periodoAnteriorData = menuData;
  } else if (today < mdFirst && today < pvFirst) {
    /* Both in the future — the earlier one is "actual" */
    periodoActualData = mdFirst < pvFirst ? menuData : menuData_prev;
    periodoAnteriorData = mdFirst < pvFirst ? menuData_prev : menuData;
  } else {
    /* Both in the past — the later one is "actual" */
    periodoActualData = mdLast > pvLast ? menuData : menuData_prev;
    periodoAnteriorData = mdLast > pvLast ? menuData_prev : menuData;
  }
})();

/* Build ID sets from the detected assignment */
function buildIdsFromMenu(md) {
  var ids = new Set();
  if (md && md.dias) {
    md.dias.forEach(function(d) {
      ['entrante','principal','guarnicion','postre'].forEach(function(k) {
        if (d[k] && d[k].id) ids.add(d[k].id);
      });
    });
  }
  return ids;
}

let periodoIds_actual = buildIdsFromMenu(periodoActualData);
let periodoIds_anterior = buildIdsFromMenu(periodoAnteriorData);

/* Also expose periodoIds for backward compat (used by switchPeriodo toggle) */
let periodoIds = periodoIds_actual;

let state = { cat: [], sub: [], search: "", selected: null, tab: "ficha", view: "home", periodo: false, autores: [] };
const navStack = [];
var isRestaurante = false;

function activePeriodoIds() {
  if (state.periodo === 'actual') return periodoIds_actual;
  if (state.periodo === 'anterior') return periodoIds_anterior;
  return null;
}

/* Build a map of recipeId → { order, dayLabel, role } for periodo sorting */
function buildPeriodoSortMap(menuDataRef) {
  var sortMap = {};
  if (!menuDataRef || !menuDataRef.dias) return sortMap;
  var roleOrder = { entrante: 0, principal: 1, guarnicion: 2, postre: 3 };
  menuDataRef.dias.forEach(function(d, dayIdx) {
    ['entrante','principal','guarnicion','postre'].forEach(function(k) {
      if (d[k] && d[k].id) {
        sortMap[d[k].id] = {
          order: dayIdx * 100 + roleOrder[k] * 10,
          dayLabel: d.ds,
          role: k,
          parentId: null,
          prot: d.prot || ''
        };
      }
    });
  });
  return sortMap;
}

var periodoSortMap_actual = buildPeriodoSortMap(periodoActualData);
var periodoSortMap_anterior = buildPeriodoSortMap(periodoAnteriorData);

/* Expand periodo IDs with componentes from assembled dishes + track parent relationships */
var componenteParents = {};
async function expandPeriodoIds() {
  async function expandAndTrack(ids, sortMap) {
    var toCheck = [...ids];
    var v = Date.now();
    for (var i = 0; i < toCheck.length; i++) {
      var id = toCheck[i];
      try {
        var res = await fetch('data/' + id + '.json?v=' + v);
        if (!res.ok) continue;
        var d = await res.json();
        if (d && d.componentes) {
          d.componentes.forEach(function(c) {
            if (c.id && !c.id.startsWith('pendiente_')) {
              ids.add(c.id);
              componenteParents[c.id] = id;
              if (sortMap[id]) {
                sortMap[c.id] = {
                  order: sortMap[id].order + 1,
                  dayLabel: sortMap[id].dayLabel,
                  role: "componente",
                  parentId: id,
                  prot: sortMap[id].prot || ''
                };
              }
            }
          });
        }
      } catch(e) {}
    }
    /* Mark remaining unassigned IDs */
    ids.forEach(function(rid) {
      if (!sortMap[rid]) {
        sortMap[rid] = { order: 9999, dayLabel: "", role: "componente", parentId: null, prot: '' };
      }
    });
  }
  await expandAndTrack(periodoIds_actual, periodoSortMap_actual);
  await expandAndTrack(periodoIds_anterior, periodoSortMap_anterior);
  periodoIds = periodoIds_actual;
}

function activeSortMap() {
  if (state.periodo === 'actual') return periodoSortMap_actual;
  if (state.periodo === 'anterior') return periodoSortMap_anterior;
  return null;
}

function count(c) {
  let r = recipes;
  const pids = activePeriodoIds();
  if (pids) r = r.filter(x => pids.has(x.id));
  return c === "all" ? r.length : r.filter(x => x.c === c).length;
}

function filter() {
  let r = recipes;
  if (isRestaurante) r = r.filter(x => x.c !== "Componentes");
  const pids = activePeriodoIds();
  if (pids) r = r.filter(x => pids.has(x.id));
  if (state.cat && state.cat.length) r = r.filter(x => state.cat.includes(x.c));
  if (state.sub && state.sub.length) r = r.filter(x => state.sub.includes(x.s));
  if (state.autores && state.autores.length) r = r.filter(x => x.a && state.autores.includes(x.a));
  if (state.search.trim()) {
    const s = state.search.toLowerCase();
    r = r.filter(x => x.n.toLowerCase().includes(s) || x.d.toLowerCase().includes(s) || x.t.toLowerCase().includes(s) || x.p.toLowerCase().includes(s));
  }
  /* Sort by periodo day order when a periodo filter is active */
  const sm = activeSortMap();
  if (sm) {
    r.sort(function(a, b) {
      var oa = sm[a.id] ? sm[a.id].order : 9999;
      var ob = sm[b.id] ? sm[b.id].order : 9999;
      return oa - ob;
    });
  }
  return r;
}

function togglePeriodo(which) {
  state.periodo = (state.periodo === which) ? false : which;
  renderCats();
  renderSubs();
  renderGrid();
  renderPeriodoBtns();
}

function renderPeriodoBtns() {
  var actualLabel = window._actualBtnLabel || 'actual';
  var anteriorLabel = window._anteriorBtnLabel || 'anterior';
  const btnActual = document.getElementById("periodo-btn-actual");
  const btnAnterior = document.getElementById("periodo-btn-anterior");
  if (btnActual) {
    btnActual.className = "cat-btn" + (state.periodo === 'actual' ? " active" : "");
    btnActual.textContent = state.periodo === 'actual' ? "✦ Periodo " + actualLabel + " (" + periodoIds_actual.size + ")" : "✦ Periodo " + actualLabel;
  }
  if (btnAnterior) {
    btnAnterior.className = "cat-btn" + (state.periodo === 'anterior' ? " active" : "");
    btnAnterior.textContent = state.periodo === 'anterior' ? "✦ Periodo " + anteriorLabel + " (" + periodoIds_anterior.size + ")" : "✦ Periodo " + anteriorLabel;
  }

/* --- JSON cache & markdown renderer --- */
const jsonCache = {};

function md2html(txt) {
  if (!txt) return '';
  let h = txt
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^---+$/gm, '<hr>')
    .replace(/^[-•·]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/^\d+[.)]\s*(.+)$/gm, '<li>$1</li>');
  h = h.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  h = h.replace(/^(\|.+\|)$/gm, function(row) {
    if (/^[\|\s\-:]+$/.test(row)) return '';
    const cells = row.split('|').filter(c => c.trim() !== '');
    const tag = row.includes('---') ? 'th' : 'td';
    return '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
  });
  h = h.replace(/((?:<tr>.*<\/tr>\n?)+)/g, '<table>$1</table>');
  h = h.replace(/^([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ\s\—\-\(\)0-9,°]{5,})$/gm, '<h3>$1</h3>');
  h = h.replace(/^(?!<[huptol])((?!\s*$).+)$/gm, '<p>$1</p>');
  h = h.replace(/\n{2,}/g, '\n');
  return h;
}

function renderSection(title, content) {
  if (!content) return '';
  return `<div class="content-section"><div class="content-section-title">${title}</div>${md2html(content)}</div>`;
}

function renderComponentes(comps) {
  if (!comps || !comps.length) return '';
  let cards = '';
  for (const c of comps) {
    const isPending = c.id.startsWith('pendiente_');
    const r = recipes.find(x => x.id === c.id);
    const name = r ? r.n : c.id.replace(/_/g, ' ').replace('pendiente ', '');
    const tipo = c.tipo ? c.tipo.replace('_', ' ') : '';
    const nota = c.nota ? ` — ${c.nota}` : '';
    if (isPending) {
      cards += `<div class="comp-card comp-card-pending">
        <div style="width:52px;height:52px;background:#1a1612;border:1px dashed #3a322a;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:#5a4e3e;font-size:20px">?</span></div>
        <div class="comp-card-info"><div class="comp-card-name">${name}</div><div class="comp-card-tipo">${tipo}${nota ? nota : ' · pendiente de crear'}</div></div>
      </div>`;
    } else {
      const img = r ? getImg(r.id) : '';
      cards += `<div class="comp-card" onclick="select('${c.id}')">
        <img class="comp-card-img" src="${img}" alt="${name}" onerror="this.style.display='none'">
        <div class="comp-card-info"><div class="comp-card-name">${name}</div><div class="comp-card-tipo">${tipo}${nota}</div></div>
        <span class="comp-card-arrow">→</span>
      </div>`;
    }
  }
  return `<div class="componentes-block"><div class="componentes-title">Componentes del Plato</div><div class="componentes-grid">${cards}</div></div>`;
}

function renderFicha(d) {
  let meta = '<div class="detail-meta">';
  if (d.pax) meta += `<div class="meta-item"><div class="meta-label">PAX</div><div class="meta-value">${d.pax}</div></div>`;
  if (d.time_total) meta += `<div class="meta-item"><div class="meta-label">Tiempo</div><div class="meta-value">${d.time_total}</div></div>`;
  if (d.technique) meta += `<div class="meta-item"><div class="meta-label">Técnica</div><div class="meta-value">${d.technique}</div></div>`;
  if (d.protein) meta += `<div class="meta-item"><div class="meta-label">Proteína</div><div class="meta-value">${d.protein}</div></div>`;
  if (d.allergens) meta += `<div class="meta-item"><div class="meta-label">Alérgenos</div><div class="meta-value">${d.allergens}</div></div>`;
  if (d.difficulty) meta += `<div class="meta-item"><div class="meta-label">Dificultad</div><div class="meta-value">${d.difficulty}</div></div>`;
  meta += '</div>';
  let html = meta;
  html += renderComponentes(d.componentes);
  html += renderSection('Ingredientes', d.ingredients);
  html += renderSection('Procedimiento', d.procedure);
  html += renderSection('Emplatado', d.plating);
  html += renderSection('Puntos Críticos', d.critical_points);
  html += renderSection('APPCC', d.appcc);
  html += renderSection('Adaptación Senior', d.senior_adaptation);
  if (d.quote) html += `<div class="quote-box">\u201C${d.quote}\u201D</div>`;
  return html;
}

function renderStory(d) {
  if (!d.storytelling) return '<p class="empty-msg">Storytelling no disponible.</p>';
  return `<div class="story-content">${md2html(d.storytelling)}</div>`;
}

async function loadJson(id) {
  if (jsonCache[id]) return jsonCache[id];
  try {
    const res = await fetch('data/' + id + '.json');
    if (!res.ok) return null;
    const data = await res.json();
    jsonCache[id] = data;
    return data;
  } catch(e) { return null; }
}

/* ============================================================
   PDF DOWNLOAD — links to pre-generated benchmark PDFs
   ============================================================ */
async function downloadPDF(id) {
  const url = 'pdfs/' + id + '.pdf';
  try {
    const res = await fetch(url, {method: 'HEAD'});
    if (res.ok) {
      const a = document.createElement('a');
      a.href = url;
      a.download = id + '.pdf';
      a.click();
    } else {
      alert('PDF no disponible para esta receta');
    }
  } catch(e) {
    alert('PDF no disponible para esta receta');
  }
}

/* ============================================================
   FILE DOWNLOAD — generic PDF download with fallback alert
   ============================================================ */
function downloadFile(url, filename) {
  fetch(url, {method: 'HEAD'}).then(function(res) {
    if (res.ok) {
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    } else {
      alert('PDF no disponible. El documento del periodo actual aún no se ha subido.');
    }
  }).catch(function() {
    alert('PDF no disponible.');
  });
}

function itemName(item) {
  if (!item) return '—';
  if (typeof item === 'object') return item.n || '—';
  return item;
}

function itemId(item) {
  return item && typeof item === 'object' ? item.id : null;
}

function itemProtein(item) {
  var id = itemId(item);
  var r = id ? recipes.find(function(x) { return x.id === id; }) : null;
  return r && r.p && r.p !== '-' ? r.p : '';
}

function cleanItemName(item) {
  return itemName(item).replace(/^🆕\s*/, '');
}

function getHomeDayIndex() {
  var days = getMenuData().dias;
  var today = new Date().toISOString().split('T')[0];
  var idx = days.findIndex(function(d) { return d.fecha === today; });
  return idx >= 0 ? idx : 0;
}

var kitchenDayIndex = 0;
var kitchenIdleRestoreState = null;
var kitchenIdleTimer = null;
var kitchenModeActive = false;

function setKitchenDay(index) {
  var days = getMenuData().dias;
  kitchenDayIndex = Math.max(0, Math.min(index, days.length - 1));
  renderHome();
}

function renderKitchenRail(days) {
  var todayIndex = getHomeDayIndex();
  var visible = days.slice(todayIndex, todayIndex + 6);
  return visible.map(function(day, offset) {
    var i = todayIndex + offset;
    var active = i === kitchenDayIndex ? ' active' : '';
    var main = cleanItemName(day.principal);
    return `<button class="kitchen-day-card${active}" onclick="setKitchenDay(${i})">
      <span class="day-dot"></span>
      <span class="kitchen-day-week">${i === todayIndex ? 'Hoy' : day.ds.slice(0, 3)}</span>
      <span class="kitchen-day-date">${day.fecha.slice(8,10)}/${day.fecha.slice(5,7)}</span>
      <span class="kitchen-day-main">${main}</span>
    </button>`;
  }).join('');
}

function renderKitchenPlate(item, role, isHero, day) {
  var id = itemId(item);
  var img = id ? getImg(id) : '';
  var name = cleanItemName(item);
  var prot = itemProtein(item);
  var roleLabel = role.toUpperCase();
  var dateLine = day ? `${day.ds} · ${day.fecha.slice(8,10)}/${day.fecha.slice(5,7)}` : '';
  var onClick = id ? `onclick="goToRecipe('${id}')"` : '';
  return `<article class="${isHero ? 'kitchen-hero-card' : 'kitchen-side-card'}" ${onClick}>
    ${img ? `<img src="${img}" alt="${name}" onerror="this.style.opacity='0.08'">` : ''}
    <div class="kitchen-badge">${roleLabel}</div>
    <div class="kitchen-plate-copy">
      <div class="kitchen-plate-date">${dateLine}</div>
      <div class="kitchen-plate-name">${name}${isHero && prot ? `<span class="kitchen-protein">${prot}</span>` : ''}</div>
    </div>
  </article>`;
}

function renderHome() {
  var days = getMenuData().dias;
  if (!days.length) return;
  if (kitchenDayIndex >= days.length) kitchenDayIndex = getHomeDayIndex();
  var d = days[kitchenDayIndex];
  if (!d) return;
  document.getElementById("kitchen-title").textContent = getMenuData().periodo;
  document.getElementById("kitchen-meta").textContent = getMenuData().pax + " PAX · " + getMenuData().ciclo;
  document.getElementById("kitchen-day-rail").innerHTML = renderKitchenRail(days);
  document.getElementById("kitchen-plate-grid").innerHTML = `
    ${renderKitchenPlate(d.principal, 'principal', true, d)}
    <div class="kitchen-side-stack">
      ${renderKitchenPlate(d.entrante, 'entrante', false, d)}
      ${renderKitchenPlate(d.postre, 'postre', false, d)}
      ${renderKitchenPlate(d.cena, 'cena', false, d)}
    </div>
  `;
}

/* ============================================================
   NAVIGATION & INTERACTION
   ============================================================ */
function switchView(v) {
  state.view = v;
  state.selected = null;
  navStack.length = 0;
  document.body.classList.toggle('home-active', v === 'home');
  if (kitchenModeActive && v === 'home') document.body.classList.add('kitchen-mode');
  
  // Hide all views
  document.getElementById("view-home").classList.add("hidden");
  document.getElementById("view-catalogo").classList.add("hidden");
  document.getElementById("view-menu").classList.add("hidden");
  document.getElementById("view-mise").classList.add("hidden");
  document.getElementById("view-compras").classList.add("hidden");
  document.getElementById("detail-view").classList.add("hidden");
  
  // Show selected view
  document.getElementById("view-" + v).classList.remove("hidden");
  
  // Update nav tabs
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
  document.querySelector(`.nav-tab[onclick="switchView('${v}')"]`).classList.add("active");
  
  window.scrollTo(0, 0);
}

function goHome() {
  if (isRestaurante) {
    switchView('menu');
    return;
  }
  switchView('home');
}

function openKitchenSystem(event) {
  if (event) event.stopPropagation();
  document.body.classList.remove('kitchen-mode');
  switchView('menu');
}

function scheduleKitchenIdle() {
  if (!kitchenModeActive) return;
  clearTimeout(kitchenIdleTimer);
  kitchenIdleTimer = setTimeout(function() {
    if (state.view !== 'home') {
      kitchenIdleRestoreState = {
        view: state.view,
        selectedId: state.selected ? state.selected.id : null,
        tab: state.tab
      };
      switchView('home');
      document.getElementById('kitchen-home').classList.add('idle-restore');
    }
  }, 90000);
}

function handleKitchenActivity(event) {
  if (!kitchenModeActive) return;
  var home = document.getElementById('kitchen-home');
  if (state.view === 'home' && kitchenIdleRestoreState && home && home.classList.contains('idle-restore')) {
    if (event) event.preventDefault();
    home.classList.remove('idle-restore');
    var target = kitchenIdleRestoreState;
    kitchenIdleRestoreState = null;
    document.body.classList.remove('kitchen-mode');
    switchView(target.view);
    if (target.selectedId) {
      state.selected = recipes.find(function(r) { return r.id === target.selectedId; }) || null;
      state.tab = target.tab || 'ficha';
      if (state.selected) renderDetail();
    }
    scheduleKitchenIdle();
    return;
  }
  scheduleKitchenIdle();
}

function toggleDay(el) {
  // Don't toggle if clicking a recipe link
  if (event.target.classList.contains('menu-recipe-link')) return;
  el.classList.toggle("open");
}

function toggleCompra(el) {
  el.classList.toggle("open");
}

function goToRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (r) {
    state.selected = r;
    state.tab = "ficha";
    renderDetail();
    window.scrollTo(0, 0);
  }
}

function setCat(c) {
  if (c === "all") {
    state.cat = [];
    state.sub = [];
  } else {
    const idx = state.cat.indexOf(c);
    if (idx >= 0) state.cat.splice(idx, 1);
    else state.cat.push(c);
    if (!state.cat.includes("Componentes")) state.sub = [];
  }
  renderCats(); renderSubs(); renderGrid();
}
function setSub(s) {
  if (s === null) {
    state.sub = [];
  } else {
    const idx = state.sub.indexOf(s);
    if (idx >= 0) state.sub.splice(idx, 1);
    else state.sub.push(s);
  }
  renderSubs(); renderGrid();
}
var _savedScrollY = 0;
function select(id) {
  _savedScrollY = window.scrollY;
  if (state.selected) navStack.push(state.selected);
  state.selected = recipes.find(r => r.id === id); state.tab = isRestaurante ? "story" : "ficha"; renderDetail(); window.scrollTo(0,0);
}
function back() {
  if (navStack.length > 0) {
    state.selected = navStack.pop();
    state.tab = "ficha";
    renderDetail();
    window.scrollTo(0,0);
  } else {
    state.selected = null;
    document.getElementById("detail-view").classList.add("hidden");
    document.getElementById("view-" + state.view).classList.remove("hidden");
    window.scrollTo(0, _savedScrollY);
  }
}
function setTab(t) { state.tab = t; renderDetail(); }

document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; renderGrid(); });

/* ============================================================
   PERIODO SWITCHING (top tabs — date-based, controls Menu/Mise/Compras)
   p1 = menuData (newest), p2 = menuData_prev (oldest)
   Independent of actual/anterior detection in catalog buttons.
   ============================================================ */
var currentPeriodo = (function() {
  var today = new Date().toISOString().split('T')[0];
  var pvFirst = menuData_prev.dias[0].fecha;
  var pvLast = menuData_prev.dias[menuData_prev.dias.length - 1].fecha;
  if (today >= pvFirst && today <= pvLast) return 'p2';
  return 'p1';
})();

function getMenuData() { return currentPeriodo === 'p1' ? menuData : menuData_prev; }
function getMiseData() { return currentPeriodo === 'p1' ? miseData : miseData_prev; }
function getComprasData() { return currentPeriodo === 'p1' ? comprasData : comprasData_prev; }

function switchPeriodo(p) {
  currentPeriodo = p;
  kitchenDayIndex = getHomeDayIndex();
  document.getElementById('tab-p1').style.background = p === 'p1' ? 'rgba(255,255,255,0.1)' : 'transparent';
  document.getElementById('tab-p1').style.color = p === 'p1' ? '#d4c5a0' : '#888';
  document.getElementById('tab-p1').style.borderColor = p === 'p1' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
  document.getElementById('tab-p2').style.background = p === 'p2' ? 'rgba(255,255,255,0.1)' : 'transparent';
  document.getElementById('tab-p2').style.color = p === 'p2' ? '#d4c5a0' : '#888';
  document.getElementById('tab-p2').style.borderColor = p === 'p2' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
  renderHome();
  renderMenu();
  renderMise();
  renderCompras();
}

function downloadPeriodoPDF(tipo) {
  /* Build suffix from the active periodo's date range */
  var md = getMenuData();
  var first = md.dias[0].fecha.slice(8,10);
  var last = md.dias[md.dias.length-1].fecha.slice(8,10);
  var firstMon = md.dias[0].fecha.slice(5,7);
  var lastMon = md.dias[md.dias.length-1].fecha.slice(5,7);
  var months = {
    '01':'ene','02':'feb','03':'mar','04':'abr','05':'may','06':'jun',
    '07':'jul','08':'ago','09':'sep','10':'oct','11':'nov','12':'dic'
  };
  var suffix = (firstMon === lastMon)
    ? parseInt(first) + '-' + parseInt(last) + months[firstMon]
    : parseInt(first) + months[firstMon] + '-' + parseInt(last) + months[lastMon];
  var paths = {
    menu: ['pdfs/Menu_periodo_' + suffix + '.pdf', 'Menu_ATTENYA.pdf'],
    mise: ['pdfs/Mise_periodo_' + suffix + '.pdf', 'Mise_en_Place_ATTENYA.pdf'],
    compras: ['pdfs/Compras_periodo_' + suffix + '.pdf', 'Compras_ATTENYA.pdf']
  };
  var p = paths[tipo];
  if (p) downloadFile(p[0], p[1]);
}

/* ============================================================
   DAY PACK — ZIP all PDFs for a given day (entrante + principal + guarnición + postre + componentes)
   ============================================================ */
async function downloadDayPack(dayIndex) {
  var md = getMenuData();
  var day = md.dias[dayIndex];
  if (!day) return;

  /* Collect all recipe IDs for this day — extract .id from {n,id} objects */
  var rawItems = [day.entrante, day.principal, day.guarnicion, day.postre, day.cena].filter(Boolean);
  var ids = rawItems
    .map(function(x) { return (x && typeof x === 'object' && x.id) ? x.id : null; })
    .filter(Boolean);

  /* Expand components: for each id, fetch its JSON and add component ids */
  var expanded = [];
  for (var id of ids) {
    expanded.push(id);
    try {
      var resp = await fetch('data/' + id + '.json');
      if (resp.ok) {
        var json = await resp.json();
        if (json.componentes && Array.isArray(json.componentes)) {
          json.componentes.forEach(function(c) { if (c.id) expanded.push(c.id); });
        }
      }
    } catch(e) { /* skip */ }
  }

  /* Deduplicate */
  var unique = [...new Set(expanded)];

  /* Fetch PDFs and build ZIP */
  var zip = new JSZip();
  var found = 0;
  for (var rid of unique) {
    try {
      var pdfResp = await fetch('pdfs/' + rid + '.pdf');
      if (pdfResp.ok) {
        var blob = await pdfResp.blob();
        zip.file(rid + '.pdf', blob);
        found++;
      }
    } catch(e) { /* skip missing */ }
  }

  if (found === 0) {
    alert('No se encontraron PDFs para este día.');
    return;
  }

  /* Generate and download ZIP */
  var zipBlob = await zip.generateAsync({ type: 'blob' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = 'Pack_' + day.ds.replace(/ /g, '_') + '.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   AUTOR FILTER (multi-select dropdown)
   ============================================================ */
function getAutoresUnicos() {
  const counts = {};
  recipes.forEach(r => { if (r.a) counts[r.a] = (counts[r.a] || 0) + 1; });
  return Object.keys(counts).sort().map(a => ({ name: a, count: counts[a] }));
}

function renderAutorDropdown() {
  const panel = document.getElementById('autorDropdownPanel');
  if (!panel) return;
  const autores = getAutoresUnicos();
  panel.innerHTML = autores.map(a => {
    const checked = state.autores.includes(a.name) ? 'checked' : '';
    return `<label class="autor-option">
      <input type="checkbox" value="${a.name}" ${checked} onchange="toggleAutor('${a.name.replace(/'/g, "\\'")}')">
      <span>${a.name}</span>
      <span class="autor-option-count">${a.count}</span>
    </label>`;
  }).join('');
}

function renderAutorChips() {
  const wrap = document.getElementById('autorChipsActive');
  const clearBtn = document.getElementById('autorClearBtn');
  const label = document.getElementById('autorDropdownLabel');
  if (!wrap) return;
  wrap.innerHTML = state.autores.map(a =>
    `<span class="autor-chip">${a}<span class="autor-chip-x" onclick="toggleAutor('${a.replace(/'/g, "\\'")}')">×</span></span>`
  ).join('');
  if (clearBtn) clearBtn.style.display = state.autores.length ? '' : 'none';
  if (label) label.textContent = state.autores.length
    ? `${state.autores.length} autor${state.autores.length !== 1 ? 'es' : ''} seleccionado${state.autores.length !== 1 ? 's' : ''}`
    : 'Filtrar por autor';
}

function toggleAutorDropdown(e) {
  if (e) e.stopPropagation();
  const panel = document.getElementById('autorDropdownPanel');
  const btn = document.getElementById('autorDropdownBtn');
  if (!panel) return;
  const isOpen = panel.classList.toggle('open');
  if (btn) btn.classList.toggle('open', isOpen);
  if (isOpen) renderAutorDropdown();
}

function toggleAutor(autor) {
  const idx = state.autores.indexOf(autor);
  if (idx >= 0) state.autores.splice(idx, 1);
  else state.autores.push(autor);
  renderAutorChips();
  renderAutorDropdown();
  renderGrid();
}

function clearAutores() {
  state.autores = [];
  renderAutorChips();
  renderAutorDropdown();
  renderGrid();
}

document.addEventListener('click', function(e) {
  const panel = document.getElementById('autorDropdownPanel');
  const btn = document.getElementById('autorDropdownBtn');
  if (!panel || !panel.classList.contains('open')) return;
  if (panel.contains(e.target) || (btn && btn.contains(e.target))) return;
  panel.classList.remove('open');
  if (btn) btn.classList.remove('open');
});

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  document.getElementById("total-count").textContent = recipes.length + " recetas · Tenerife";
  document.getElementById("footer").textContent = "ATTENYA · SISTEMA CULINARIO · " + recipes.length + " RECETAS · 2026";
  
  /* Populate top periodo tabs with dates from data */
  document.getElementById('tab-p1').textContent = menuData.periodo;
  document.getElementById('tab-p2').textContent = menuData_prev.periodo;
  
  var today = new Date().toISOString().split('T')[0];
  var mdFirst = menuData.dias[0].fecha;
  var mdLast = menuData.dias[menuData.dias.length - 1].fecha;
  var pvFirst = menuData_prev.dias[0].fecha;
  var pvLast = menuData_prev.dias[menuData_prev.dias.length - 1].fecha;
  var p1Label = (today >= mdFirst && today <= mdLast) ? 'actual'
              : (today < mdFirst) ? 'siguiente'
              : 'anterior';
  var p2Label = (today >= pvFirst && today <= pvLast) ? 'actual'
              : (today < pvFirst) ? 'siguiente'
              : 'anterior';
  document.getElementById('tab-p1').textContent = menuData.periodo + ' (' + p1Label + ')';
  document.getElementById('tab-p2').textContent = menuData_prev.periodo + ' (' + p2Label + ')';
  var btnAnterior = document.getElementById('periodo-btn-anterior');
  if (btnAnterior) { var otherLabel = currentPeriodo === 'p1' ? p2Label : p1Label; btnAnterior.textContent = '✦ Periodo ' + otherLabel; }
  
  window._p1Label = p1Label; window._p2Label = p2Label;
  // Labels for catalog periodo filter buttons
  // periodoActualData is always labeled 'actual'
  window._actualBtnLabel = 'actual';
  // periodoAnteriorData: check if it's past or future relative to today
  var antFirst = periodoAnteriorData.dias[0].fecha;
  window._anteriorBtnLabel = antFirst > today ? 'siguiente' : 'anterior';
  switchPeriodo(currentPeriodo);
  
  /* Expand periodo IDs with components from assembled dishes */
  await expandPeriodoIds();
  
  /* Check URL parameters */
  var params = new URLSearchParams(window.location.search);
  var modo = params.get('modo');
  if (!modo && isStandaloneKitchenApp()) modo = 'cocina';
  if (modo === 'restaurante') isRestaurante = true;

  renderCats();
  renderSubs();
  renderGrid();
  renderHome();
  renderMenu();
  renderMise();
  renderCompras();

  if (!modo) {
    kitchenDayIndex = getHomeDayIndex();
    renderHome();
    switchView('home');
  }
  
  /* modo=cocina: activate periodo filter + switch to kitchen home */
  if (modo === 'cocina') {
    kitchenModeActive = true;
    document.body.classList.add('kitchen-mode');
    kitchenDayIndex = getHomeDayIndex();
    state.periodo = 'actual';
    renderCats();
    renderSubs();
    renderGrid();
    renderHome();
    renderPeriodoBtns();
    switchView('home');
    ['pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
      document.addEventListener(evt, handleKitchenActivity, { passive: evt !== 'touchstart' });
    });
    scheduleKitchenIdle();
  }
  /* modo=restaurante: like cocina but hide operational UI */
  if (modo === 'restaurante') {
    isRestaurante = true;
    /* Show back link */
    document.getElementById('rest-back').classList.remove('hidden');
    /* Change header text */
    document.querySelector('.header h1').textContent = 'Nuestra Cocina';
    document.getElementById('total-count').textContent = 'Tenerife';
    /* Hide periodo selector tabs */
    document.querySelector('.periodo-tabs').style.display = 'none';
    /* Hide search bar */
    document.querySelector('.search-wrap').style.display = 'none';
    /* Hide operational nav tabs */
    document.querySelectorAll('.nav-tab').forEach(function(tab) {
      if (tab.textContent.trim() === 'Inicio' || tab.textContent.trim() === 'Mise en Place' || tab.textContent.trim() === 'Compras') tab.style.display = 'none';
    });
    /* Hide PDF buttons and meta line in menu header */
    document.querySelectorAll('#view-menu .pdf-btn').forEach(function(btn) { btn.style.display = 'none'; });
    document.getElementById('menu-meta').style.display = 'none';
    state.periodo = 'actual';
    renderCats();
    renderSubs();
    renderGrid();
    renderPeriodoBtns();
    switchView('menu');
  }
  /* modo=periodo: just activate periodo filter on catalog */
  if (modo === 'periodo') {
    state.periodo = 'actual';
    renderCats();
    renderSubs();
    renderGrid();
    renderPeriodoBtns();
    switchView('catalogo');
  }
}

init();
renderAutorChips();
startSelfUpdater();
</script>
